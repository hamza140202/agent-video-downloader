[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-video-downloader"
version = "1.2.2"
description = "yt-dlp for agents: a cloud-CLI multi-agent video downloader for TikTok, Instagram, Douyin, Rednote, Reddit, X.com"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "ansaribilal1402", email = "noreply@github.com"},
]
maintainers = [
    {name = "ansaribilal1402", email = "noreply@github.com"},
]
# Research sources — see CONTRIBUTORS.md for full attribution.
# The Bilal140202/* family of repos (ytagent, ttagent, igagent, xthread-agent)
# contributed architectural patterns during the audit phase. See docs/research-blog.md §3.1.
keywords = ["video", "downloader", "tiktok", "instagram", "douyin", "rednote", "xiaohongshu", "reddit", "twitter", "agents", "cli", "mcp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "aiofiles>=23.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3",
    "tenacity>=8.5,<10.0",
    "pybreaker>=1.3,<2.0",
    "rich>=13.0,<14.0",
    "click>=8.1,<9.0",
    "python-magic>=0.4.27",
    "structlog>=24.0",
    "aiosqlite>=0.20",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "Levenshtein>=0.25",
    "yt-dlp>=2025.10.0",
    "feedparser>=6.0",
]

[project.urls]
Homepage = "https://github.com/hamza140202/agent-video-downloader"
Repository = "https://github.com/hamza140202/agent-video-downloader"
Documentation = "https://github.com/hamza140202/agent-video-downloader#readme"
Bug-Tracker = "https://github.com/hamza140202/agent-video-downloader/issues"
Changelog = "https://github.com/hamza140202/agent-video-downloader/releases"

[project.optional-dependencies]
browser = ["playwright>=1.40"]
http = ["uvicorn>=0.30", "fastapi>=0.110"]
mcp = ["mcp>=1.0"]
socks = ["socksio>=1.0"]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "respx>=0.21",
    "hypothesis>=6.100",
    "freezegun>=1.5",
]

[project.scripts]
avd = "avd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "smoke: quick end-to-end smoke tests (deselect with -m 'not smoke')",
    "integration: live network integration tests (deselect with -m 'not integration')",
]

[tool.coverage.run]
source = ["avd"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
