name: Download YouTube Reference
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube URL'
        required: true
        default: 'https://www.youtube.com/watch?v=djUy3krFvWU'
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yt-dlp
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg && pip install yt-dlp
      - name: Download video
        run: |
          mkdir -p out
          yt-dlp -f 'bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best' \
            --merge-output-format mp4 \
            --write-info-json \
            --write-thumbnail \
            -o 'out/reference.%(ext)s' \
            "${{ inputs.video_url }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-reference
          path: out/
          retention-days: 1
